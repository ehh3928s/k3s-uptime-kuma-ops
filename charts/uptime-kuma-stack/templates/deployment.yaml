apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "uk.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "uk.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  # 单副本 + RWO 卷，滚动更新会卡在 Multi-Attach，
  # 必须 Recreate：先停旧 Pod 释放卷，再起新 Pod。
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "uk.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "uk.selectorLabels" . | nindent 8 }}
    spec:
      {{- if .Values.podSecurityContext.enabled }}
      securityContext:
        runAsUser: {{ .Values.podSecurityContext.runAsUser }}
        runAsGroup: {{ .Values.podSecurityContext.runAsGroup }}
        fsGroup: {{ .Values.podSecurityContext.fsGroup }}
      {{- end }}
      containers:
        - name: {{ include "uk.fullname" . }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if .Values.containerSecurityContext.enabled }}
          securityContext:
            allowPrivilegeEscalation: {{ .Values.containerSecurityContext.allowPrivilegeEscalation }}
            {{- if .Values.containerSecurityContext.dropAllCapabilities }}
            capabilities:
              drop:
                - ALL
            {{- end }}
          {{- end }}
          {{- with .Values.extraEnv }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
          volumeMounts:
            - name: data
              mountPath: /app/data
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "uk.pvcName" . }}
